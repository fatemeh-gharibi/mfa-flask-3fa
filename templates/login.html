<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: white;
    color: #1f2937;
    display: flex;
    justify-content: space-around;
}

.page {
    min-height: 100vh;
    display: flex;
}

.image-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 40px;
    box-sizing: border-box;
}

.image-side img {
    width: 120%;
    max-width: 700px;
    object-fit: contain;
}

.form-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.box {
    width: 360px;
    padding: 40px;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;

   box-shadow: 9px 0px 34px rgba(0, 0, 255, 0.20);
}

.title {
    font-size: 28px;
    font-weight: 650;
    color: #111827;
}

.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 28px;
}

.progress {
    display: flex;
    gap: 7px;
    margin-bottom: 28px;
}

.dot {
    width: 24px;
    height: 4px;
    background: #dbe2ea;
    border-radius: 20px;
}

.dot.active {
    background: #3b82f6;
}

input {
    width: 100%;
    box-sizing: border-box;

    padding: 14px;
    margin-bottom: 12px;

    border: 1px solid #d7dce3;
    border-radius: 10px;

    background: #f9fafb;
    color: #111827;

    font-size: 14px;
    outline: none;
}

input:focus {
    background: white;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 5px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.footer {
    margin-top: 22px;
    font-size: 13px;
    color: #6b7280;
}

.footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}

@media (max-width: 850px) {
    .image-side {
        display: none;
    }

    .form-side {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="image-side">
        <img src="/static/secPic.jpg" alt="Security illustration">
    </div>

    <div class="form-side">

        <div class="box">

            <div class="title">Sign in</div>
            <div class="subtitle">Triple-factor authentication</div>

            <div class="progress">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <form method="POST">
                <input name="username"
                       placeholder="Username"
                       autocomplete="username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="current-password"
                       required>

                <button>Continue</button>
            </form>

            <div class="footer">
                New here?
                <a href="/register">Create account</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
