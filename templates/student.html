<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student profile | Secure University Portal</title><style>
:root{--blue:#2457d6;--ink:#17243b;--muted:#66758c;--line:#e3e9f2}*{box-sizing:border-box}body{margin:0;background:#f5f8fe;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:19px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header strong{font-size:18px}nav a{margin-left:16px;color:var(--blue);font-weight:600;text-decoration:none}main{max-width:1050px;margin:50px auto;padding:0 22px}h1{font-size:34px;margin:0 0 12px}p{color:var(--muted);line-height:1.65}.eyebrow{color:#17865a;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 8px 28px #183c8210}.card h2{margin:0 0 10px;font-size:20px}a.button,button{display:inline-block;border:0;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer}.secondary{background:#edf2ff!important;color:var(--blue)!important}input{padding:13px;border:1px solid #cdd8e7;border-radius:10px;min-width:220px;max-width:100%;font-size:15px}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#e9f1ff;color:#2457d6;font-size:12px;font-weight:700}.notice{background:#eaf7f1;border:1px solid #c2e7d3;border-radius:12px;padding:14px 18px;color:#196545;margin:24px 0}@media(max-width:650px){nav a{margin-left:0;margin-right:12px}h1{font-size:28px}}</style></head><body><header><strong>🎓 Secure University Portal</strong><nav><a href="/dashboard">Dashboard</a><a href="/directory">Directory</a><a href="/my-record">My record</a><a href="/logout">Log out</a></nav></header><main><div class="eyebrow">Directory profile · fictional data</div><div class="card"><h1>{{ student['display_name'] }}</h1><span class="tag">Year {{ student['year'] }}</span><p><strong>Program:</strong> {{ student['program'] }}</p><p>{{ student['bio'] }}</p><p class="muted">Private academic records are not exposed through the directory.</p><a class="button secondary" href="/directory">← Back to directory</a></div></main></body></html>
