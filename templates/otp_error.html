<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OTP Error</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: white;
    color: #1f2937;
}

.page {
    min-height: 100vh;
    display: flex;
}

.image-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 40px;
    box-sizing: border-box;
}

.image-side img {
    width: 120%;
    max-width: 700px;
    object-fit: contain;
}

.form-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.box {
    width: 360px;
    padding: 40px;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;

    text-align: center;

    box-shadow: 9px 0px 34px rgba(0, 0, 255, 0.20);
}

.icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;
    background: #fee2e2;
    color: #dc2626;

    font-size: 26px;
    font-weight: 700;
}

.title {
    font-size: 26px;
    font-weight: 650;
    color: #111827;
    margin-bottom: 8px;
}

.msg {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 14px;
}

.attempt {
    display: inline-block;
    margin-bottom: 22px;
    padding: 7px 12px;

    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 8px;

    color: #6b7280;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

a {
    text-decoration: none;
}

@media (max-width: 850px) {
    .image-side {
        display: none;
    }

    .form-side {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="image-side">
        <img src="/static/secPic.jpg" alt="Security illustration">
    </div>

    <div class="form-side">

        <div class="box">

            <div class="icon">!</div>

            <div class="title">Verification failed</div>

            <div class="msg">
                {{ message }}
            </div>

            {% if attempts %}
            <div class="attempt">
                Attempts: {{ attempts }}/{{ max_attempts or 3 }}
            </div>
            {% endif %}

            <a href="/">
                <button>Back to Login</button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
