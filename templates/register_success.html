<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Setup Google Authenticator</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: white;
    color: #1f2937;
}

.page {
    min-height: 100vh;
    display: flex;
}

.image-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 40px;
    box-sizing: border-box;
}

.image-side img {
    width: 120%;
    max-width: 700px;
    object-fit: contain;
}

.form-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.box {
    width: 390px;
    padding: 40px;

    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;

    box-shadow: 9px 0px 34px rgba(0, 0, 255, 0.20);
}

.success-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 11px;
    margin-bottom: 16px;

    border-radius: 8px;

    background: #ecfdf5;
    border: 1px solid #bbf7d0;

    color: #16a34a;
    font-size: 13px;
    font-weight: 600;
}

.title {
    font-size: 28px;
    font-weight: 650;
    color: #111827;
}

.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 22px;
    line-height: 1.5;
}

.qr-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

.qr-box {
    background: white;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.qr-box img {
    display: block;
    width: 180px;
    height: 180px;
}

.steps {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 10px;

    padding: 16px;
    margin: 20px 0;

    font-size: 13px;
    color: #6b7280;
    line-height: 1.8;
}

.steps-title {
    color: #111827;
    font-weight: 600;
    margin-bottom: 5px;
}

.steps strong {
    color: #374151;
}

button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

a {
    text-decoration: none;
}

@media (max-width: 850px) {
    .image-side {
        display: none;
    }

    .form-side {
        width: 100%;
    }
}
</style>

</head>

<body>

<div class="page">

    <div class="image-side">
        <img src="/static/secPic.jpg" alt="Security illustration">
    </div>

    <div class="form-side">

        <div class="box">

            <div class="success-badge">
                ✓ Account created
            </div>

            <div class="title">Set up Authenticator</div>

            <div class="subtitle">
                Scan this QR code with Google Authenticator to complete your security setup.
            </div>

            <div class="qr-container">
                <div class="qr-box">
                    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code">
                </div>
            </div>

            <div class="steps">

                <div class="steps-title">How to set up</div>

                1. Install <strong>Google Authenticator</strong> on your phone<br>
                2. Tap <strong>+</strong> and choose <strong>Scan QR code</strong><br>
                3. Scan the QR code above<br>
                4. Use the generated 6-digit code when logging in

            </div>

            <a href="/">
                <button>Go to Login</button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
