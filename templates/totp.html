<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Authenticator</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: white;
    color: #1f2937;
}

.page {
    min-height: 100vh;
    display: flex;
}

.image-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    padding: 40px;
    box-sizing: border-box;
}

.image-side img {
    width: 120%;
    max-width: 700px;
    object-fit: contain;
}

.form-side {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.box {
    width: 360px;
    padding: 40px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    box-shadow: 9px 0px 34px rgba(0, 0, 255, 0.20);
}

.title {
    font-size: 28px;
    font-weight: 650;
    color: #111827;
}

.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 24px;
}

.progress {
    display: flex;
    gap: 7px;
    margin-bottom: 22px;
}

.dot {
    width: 24px;
    height: 4px;
    background: #dbe2ea;
    border-radius: 20px;
}

.dot.active {
    background: #3b82f6;
}

.success-list {
    margin-bottom: 20px;
}

.success {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #16a34a;
    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

.check {
    width: 20px;
    height: 20px;
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #ecfdf5;
    border: 1px solid #bbf7d0;

    font-size: 11px;
}

.info {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.info strong {
    color: #374151;
}

input {
    width: 100%;
    box-sizing: border-box;

    padding: 14px;
    margin-bottom: 12px;

    border: 1px solid #d7dce3;
    border-radius: 10px;

    background: #f9fafb;
    color: #111827;

    font-size: 20px;
    text-align: center;
    letter-spacing: 7px;

    outline: none;
}

input::placeholder {
    color: #c2c8d0;
}

input:focus {
    background: white;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 5px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

@media (max-width: 850px) {
    .image-side {
        display: none;
    }

    .form-side {
        width: 100%;
    }
}
</style>

</head>

<body>

<div class="page">

    <div class="image-side">
        <img src="/static/secPic.jpg" alt="Security illustration">
    </div>

    <div class="form-side">

        <div class="box">

            <div class="title">Authenticator code</div>
            <div class="subtitle">Step 3 of 3</div>

            <div class="progress">
                <div class="dot active"></div>
                <div class="dot active"></div>
                <div class="dot active"></div>
            </div>

            <div class="success-list">

                <div class="success">
                    <div class="check">✓</div>
                    Password verified
                </div>

                <div class="success">
                    <div class="check">✓</div>
                    Email OTP verified
                </div>

            </div>

            <div class="info">
                Open Google Authenticator and enter the
                6-digit code for <strong>3FA Demo</strong>.
            </div>

            <form method="POST">

                <input
                    name="totp_code"
                    placeholder="000000"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="one-time-code"
                    required>

                <button>Verify</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
